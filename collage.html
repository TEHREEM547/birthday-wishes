
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="collage.css">
</head>
<body>

    <div class="birthday-card">

        <!-- Top Left Photo -->
        <div class="photo photo1">
            <img src="images/img 1.jpg" alt="Birthday Memory">
        </div>

        <!-- Top Note -->
        <div class="note note1">
            You are always in my heart ❤️
            <br>
            My sweetest person!
        </div>

        <!-- Top Right Photo -->
        <div class="photo photo2">
            <img src="images/img 3.jpg" alt="Memory">
        </div>

        <!-- Birthday Heading -->
        <h1>
            <span>HAPPY</span>
            <span>BIRTHDAY</span>
        </h1>

        <!-- Left Bottom Photo -->
        <div class="photo photo3">
            <img src="images/img 3.jpg" alt="Memory">
        </div>

        <!-- Center Bottom Photo -->
        <div class="photo photo4">
            <img src="images/img 4.jpg" alt="Memory">
        </div>

        <!-- Right Bottom Note -->
        <div class="note note2">
          You are my favourite reason to smile❤️!
            <br>
            Happy Birthday My Love.❤️!
        </div>

        <!-- Bottom Right Photo -->
        <div class="photo photo5">
            <img src="images/img 5.jpg" alt="Memory">
        </div>

        <div class="footer">
            Made with Love ❤️
        </div>

    </div>

</body>
</html>
