
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <link rel="stylesheet" href="birthday .css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="birthday-screen">

        <div class="top-icon">🎀</div>

        <p class="small-text">A SPECIAL DAY FOR YOU</p>

        <h1>Happy Birthday</h1>

        <h2>My Beautiful Friend</h2>

        <p class="message">
            Today is your special day!
            May your life always be filled with happiness,
            love, laughter and beautiful memories.
            You deserve all the happiness in the world.
        </p>

        <div class="decoration">♡ ✿ ♡</div>

        <div class="gallery">

            <div class="photo">
                <img src="images/photo1.jpg" alt="Memory 1">
            </div>

            <div class="photo">
                <img src="images/photo2.jpg" alt="Memory 2">
            </div>

            <div class="photo">
                <img src="images/photo3.jpg" alt="Memory 3">
            </div>

            <div class="photo">
                <img src="images/photo4.jpg" alt="Memory 4">
            </div>

        </div>

        <p class="bottom-text">
            Made with Love ♡ Just For You
        </p>

    </div>

</body>
</html>
